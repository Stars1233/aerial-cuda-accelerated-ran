# F14 64TR isolated SRS MMSE (run1 TV).

config:
  usecase: F14
  vector_files:
    PDSCH:
      - TVnr_DLMIX_20566_PDSCH_gNB_CUPHY_s6p15.h5
    PUSCH:
      - TVnr_ULMIX_21564_PUSCH_gNB_CUPHY_s4p7.h5
    DLBFW:
      - TVnr_9366_BFW_gNB_CUPHY_s0.h5
    ULBFW:
      - TVnr_9366_BFW_gNB_CUPHY_s0.h5
    SRS:
      - TVnr_ULMIX_21673_SRS_gNB_CUPHY_s3p47.h5
  uc: uc_avg_F14_TDD.json
  gpu: 0
  freq: 1605
  power: 165
  start: 6
  cap: 6
  slots: 30
  iterations: 1
  delay: 10000
  tdd_pattern: dddsuudddd_mMIMO
  graph: true
  srs_only: true
  prach: false
  pdcch: false
  pucch: false
  ssb: false
  csirs: false
  rec_bf: false
  mac: false
