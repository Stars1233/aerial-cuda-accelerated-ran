[build-system]
requires = [
    "setuptools>=61.0.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "pyaerial"
dynamic = ["version"]
description = "NVIDIA pyAerial library"
authors = [
    { name = "NVIDIA" },
]
requires-python = ">=3.10"
dependencies = [
    "gpu3gppchan==0.1.4",
    "numpy",
    "tqdm>=4.67.3",
    "cuda-python==13.3.1",
    "cupy-cuda13x>=13.6.0",
    "protobuf>=6.33.5",
    "h5py==3.15.1",
    "pandas==2.3.3",
    "matplotlib",
    "cuda-toolkit[cudart,cublas,cufft,curand,cusolver,cusparse,nvjitlink]==13.*",
]

[project.optional-dependencies]
ml = [
    "torch==2.12.1+cu132",
    "tensorrt==10.14.1.48.post1",
    "tensorrt_dispatch==10.14.1.48.post1",
    "tensorrt_lean==10.14.1.48.post1",
    "onnx==1.20.1",
    "onnxscript==0.6.0",
    "polygraphy==0.49.26",
]
ml-amd64 = [
    "onnxruntime-gpu==1.22.0",
]
ml-arm64 = [
    "onnxruntime==1.22.0",
]
notebooks = [
    "jupyter==1.1.1",
    "ipympl==0.10.0",
    "nbconvert==7.17.0",
    "sshtunnel==0.4.0",
    "clickhouse-connect==0.15.1",
]
dev = [
    "flake8==7.3.0",
    "astroid==4.0.3",
    "pylint==4.0.4",
    "pytest==9.0.2",
    "pytest-mock==3.15.1",
    "PyYAML==6.0.3",
    "pyarrow",
    "mypy",
    "interrogate",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "aerial.version_aerial.RELEASE" }

[tool.interrogate]
exclude = [
    "setup.py",
    "tests",
    "notebooks",
]
fail_under = 100

[[tool.mypy.overrides]]
module = ["onnxruntime.*"]
ignore_missing_imports = true
