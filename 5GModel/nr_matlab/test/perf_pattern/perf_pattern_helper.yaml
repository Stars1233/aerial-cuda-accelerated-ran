# pattern_files: consumed by perfPatternTvYaml.m (loadPatternFileIncludes) and
# tv_space_analysis.py. The per-pattern definitions are split by radio family
# for readability; all listed files are loaded and merged into one pattern set.
pattern_files:
- perf_pattern_legacy.yaml
- perf_pattern_4tr.yaml
- perf_pattern_64tr.yaml

