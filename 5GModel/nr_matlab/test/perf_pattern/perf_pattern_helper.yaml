# Shared PERF-pattern TV number registry for MATLAB TV generation and POC2
# launch-pattern generation.
#
# Pattern-specific data lives under one top-level patterns entry per pattern id.
# ranges.ULMIX / ranges.DLMIX / ranges.BFW may contain multiple non-contiguous
# TV ranges; reused TVs are intentionally allowed and readers de-duplicate the
# generated TV lists. For DLMIX and ULMIX, mark one tvs entry as main. POC2
# derives dl_tv/ul_tv from that main range when those fields are not explicitly
# provided. Mark reused or extra ranges as additional.
#
# comment is a human-readable summary. reuses marks TV ranges that are shared
# with an earlier pattern entry, including exact matches and sub-ranges:
#   side: DLMIX, ULMIX, or BFW. This is the TV side/channel that reuses TVs.
#   from: source pattern id that originally owns or already lists those TVs.
#   tvs: TV number or range used by this pattern.
#   from_tvs: optional broader source range when tvs is only a subset of the
#     source pattern range. Example: pattern 87 reuses two pieces of pattern 79's
#     DLMIX 13067-13216 range while excluding 13172-13186.
#
# config_cells is the TV-config stride used by DLMIX/ULMIX TV tables and
# POC2 launch-pattern numbering; TV ranges must be divisible by config_cells.
# full_cells and compact_cells are the cell counts generated in full/compact
# sets and may be smaller than config_cells.
#
# For POC2, pattern_type/channel plus optional dl_tv/ul_tv, s_slot,
# bfw_srs_bind, and overrides live in the same pattern entry. Keep explicit
# dl_tv/ul_tv only for special cases such as CA, 80slots multi-TV lists, or
# patterns without a usable main DLMIX/ULMIX range.
# base_tv_only marks source TV ranges that may be reused by full patterns but
# must not be directly generated by genPerfPattern. Entries with genperf: true
# and no pattern_type are TV-generation-only and do not generate POC2 launch
# pattern files.
# ranges.<side>.command_expr is optional and affects only the printed
# genPerfPattern command text; tvs remains the source of truth for TV ranges and
# table generation.

# genperf: consumed by genPerfPattern.m (genPerfPatternNames) via
# perfPatternTvYaml('genperf_pattern_names','compact'). compact_patterns lists
# the pattern ids generated in the compact genPerfPattern set. Entries are
# matched (as strings) against the pattern id fields in the included pattern
# files. Numeric entries (69) and quoted entries ('69') are both accepted and
# treated identically; use whichever is clearer.
genperf:
  compact_patterns:
  - 59c
  - 60c
  - 69
# dlmix / ulmix: consumed by testCompGenTV_dlmix.m / testCompGenTV_ulmix.m via
# perfPatternTvYaml('tv_table','dlmix'|'ulmix').
#   compact_gpu_tvs - curated TVs that must generate BOTH cuPHY and FAPI (the
#     cuBB GPU test-bench representatives). They are excluded from the
#     FAPI-only compact set so they get full cuPHY+FAPI generation. This is an
#     editorial selection and is NOT derivable from the pattern ranges.
#   full_gpu_tvs - extra FAPI-only TVs that the FULL set must generate on top of
#     the full_cells subset. These are perf-range (<20000) config-block cells
#     referenced by nrSim launch patterns (genLaunchPatternFile.m) that fall
#     inside a perf-pattern range with full_cells < config_cells, so the plain
#     full-set split would otherwise skip them. They are added to full_TC and
#     kept FAPI-only (no cuPHY). NOT derivable from the pattern ranges.
#   tc_ranges.selected_high / full_high - upper bound of the contiguous test
#     case scan window (1000:high) for the selected/full TV sets.
dlmix:
  compact_gpu_tvs:
  - 9481   # pattern 59c DLMIX, range 9472-10271
  - 9696   # pattern 59c DLMIX, range 9472-10271
  - 9905   # pattern 59c DLMIX, range 9472-10271
  - 9906   # pattern 59c DLMIX, range 9472-10271
  - 10047  # pattern 59c DLMIX, range 9472-10271
  - 7484   # pattern 101 DLMIX, range 7472-7495
  - 7481   # pattern 101 DLMIX, range 7472-7495
  - 7516   # pattern 102 DLMIX, range 7496-7519
  - 7529   # pattern 103 DLMIX, range 7520-7591
  - 7551   # pattern 103 DLMIX, range 7520-7591
  - 7578   # pattern 103 DLMIX, range 7520-7591
  - 13956  # pattern 201 DLMIX, range 13952-13966
  # full_gpu_tvs: FAPI-only cells used by buildMixedCellPattern (nrSim
  # launch_pattern_nrSim_90200/90201, case 200/201) for cell 2 (+1 offset) of
  # pattern 61 DLMIX range 7872-8271 (config_cells=20, full_cells=1). The
  # full-set split keeps only cell 0 (7872, 7892, ...), so these are added back.
  full_gpu_tvs:
  - 7873
  - 7893
  - 7913
  - 7933
  - 7953
  - 7973
  - 7993
  - 8013
  - 8033
  - 8053
  - 8073
  - 8093
