  - 8153
  - 8173
  - 8193
  - 8213
  - 8233
  - 8253
  tc_ranges:
    selected_high: 13966
    full_high: 13966
# ulmix: see dlmix above; same fields, ULMIX side.
ulmix:
  compact_gpu_tvs:
  - 4544
  - 4548
  - 4566
  - 4382
  - 4417
  - 8310
  - 8337
  - 8375
  - 8393
  - 8576
  - 8605
  - 8648
  - 8656
  - 8671
  # full_gpu_tvs: FAPI-only cells used by buildMixedCellPattern (nrSim
  # launch_pattern_nrSim_90200/90201, case 200/201) for cell 2 (+1 offset) of
  # pattern 61 ULMIX range 3360-3439 (config_cells=20, full_cells=1). The
  # full-set split keeps only cell 0 (3360, 3380, ...), so these are added back.
  full_gpu_tvs:
  - 3361
  - 3381
