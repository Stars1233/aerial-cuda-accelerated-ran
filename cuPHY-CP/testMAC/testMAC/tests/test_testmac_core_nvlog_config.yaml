---
# Quiet nvlog config for test_testmac_core. Keep errors visible while avoiding
# launch-pattern/prebuild CON logs on stdout during TV-heavy unit tests.
aerial_sdk_version: 26-2-cubb
nvlog:
  shm_log_level: 2
  max_file_size_bytes: 500000000
  max_rotating_file_num: 2
  log_file_path: "/tmp"
  nvlog_tags:
    - 0: ""
    - 16: "NVLOG.CPP"
    - 20: "NVLOG.EXIT_HANDLER"
    - 400: "MAC"
    - 401: "MAC.LP"
    - 402: "MAC.FAPI"
    - 404: "MAC.SCF"
    - 406: "MAC.CFG"
    - 407: "MAC.PROC"
    - 408: "MAC.VALD"
