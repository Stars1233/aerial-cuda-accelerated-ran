# Actor-critic architecture for DRL link adaptation.
#
# One shared encoder feeds a categorical actor over the 28 NR MCS indices and a
# scalar critic. The policy runs per UE row, so width is set by the observation
# rather than by how many UEs the scheduler admits.
#
# The observation is 8 * num_prb_groups + 6 features, so its width scales with
# the carrier: 142 at 17 PRB groups. The encoder was sized for a much wider
# observation than that and has not been re-swept since, so it is a safe
# starting point rather than a tuned one. Narrow it if your carrier has few PRB
# groups.

architecture:
  encoder_layers: [256, 256, 256, 256]
  actor_head_layers: [256]
  critic_head_layers: [256, 256]

normalization:
  # Running Welford statistics over active UE rows only, kept in the module so
  # a checkpoint carries the statistics its weights were trained under.
  obs_normalization: true
  obs_norm_clip: 10.0

initialization:
  # Near-zero actor output gain keeps the initial policy close to uniform over
  # the 28 MCS, so teacher cloning starts from maximum entropy rather than from
  # an arbitrary preferred modulation.
  actor_output_gain: 0.01
  critic_output_gain: 1.0
