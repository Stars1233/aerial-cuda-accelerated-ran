# Link adaptation loop settings.
#
# Section names are organizational only. Every leaf key maps directly to a
# LaEnvConfig field. Nothing here describes the radio, the channel or the
# scheduler: those come from the host simulator through its CarrierProfile, so
# this file is portable across simulators.

action:
  # One MCS per scheduled physical UE per slot. That is the transport-block
  # granularity: a UE's resources across every PRB group it holds are
  # aggregated by EESM into one effective SINR, so a non-contiguous allocation
  # still carries a single modulation.
  #
  # Set drl_absolute_mcs to false to make the action a delta against the outer
  # loop instead, and narrow action_delta_min/max accordingly (for example -4
  # and +4). The absolute action space is the default because it lets the policy
  # disagree with the outer loop outright rather than only trimming it.
  drl_absolute_mcs: true
  action_delta_min: 0
  action_delta_max: 27

bler:
  # The operating point, shared by the environment, the teacher and the reward
  # so the three cannot disagree about what "on target" means. Match these to
  # the target your own outer loop is tuned for before comparing against it.
  target_bler: 0.10
  # Slack above target before a UE counts as in debt and the teacher's bound
  # tightens to debt_bler_bound, forcing repayment before it may chase
  # spectral efficiency again.
  bler_cushion: 0.05
  debt_bler_bound: 0.07
  # Decay of the per-UE sliding BLER window, applied once per scheduled slot.
  # 0.02 gives roughly a 50-slot memory.
  bler_ema_alpha: 0.02

reward:
  # Per-layer expected goodput SE[mcs] * (1 - BLER). Normalizing by neither the
  # rank nor the resource count is deliberate: link adaptation picks only the
  # modulation, so paying it for resources the scheduler granted would credit
  # it for another component's decisions.
  goodput_reward_weight: 1.0
  # Shaping term rewarding movement of the sliding BLER window toward target.
  # Off by default; the goodput term already prices block errors, and the two
  # disagree whenever a UE is better off spending BLER budget for rate.
  bler_adjust_award: 0.0

features:
  sinr_feature_norm_db: 30.0
  # Null normalizes feedback ages by the simulator's csi_report_period_slots,
  # so 1.0 means "one reporting period old".
  feedback_age_norm_slots: null
  obs_clip: 5.0
  # Null uses every physical UE slot the simulator declares, which keeps the
  # action axis equal to the UE index.
  max_scheduled_ues: null

illa:
  # Inner loop. Reported CQI is a single-user, full-power measurement of
  # P_prbg * ||H||_F^2 / (N + ICI); the scheduler then splits that power across
  # the co-scheduled layers, steers a precoder that no longer matches the UE,
  # and leaves intra-cell leakage behind. Each level prices one more of those,
  # using only the channel estimate, the precoder built from it, and the
  # reported interference. The realized channel is never read.
  #
  #   power_split             equal power split across co-scheduled layers
  #   beamforming_gain        + post-precoder desired power from the estimate
  #   beamforming_and_leakage + intra-cell leakage the precoder fails to null
  #   estimation_error_floor  + the leakage those nulls will miss, which the
  #                             estimate cannot see because the precoder was
  #                             solved from it
  #
  # On the reference configuration, prediction error against the realized
  # effective SINR fell monotonically over the first three levels. The default
  # stops one level short deliberately: estimation_error_floor makes the inner
  # loop usable on its own, but stacked with the outer loop it double-counts
  # the same missed nulls and cost a double-digit percentage of cell spectral
  # efficiency. Choose estimation_error_floor when running the inner loop alone,
  # and re-sweep the ladder against your own precoder either way.
  illa_calibration: beamforming_and_leakage

  # Gain on the estimation-error leakage floor. The floor is derived from a
  # first-principles isotropic-error argument, which lands optimistic because a
  # regularized precoder does not null perfectly even in estimate space; this
  # constant closes that gap and is precoder specific. On the reference
  # configuration the realized leakage sat about 12 dB above the unit-gain
  # floor and 15 dB was the plateau-robust pick across carrier sizes. Only read
  # when illa_calibration is estimation_error_floor.
  illa_leakage_floor_gain_db: 15.0

olla:
  # Outer loop: the deployable baseline the DRL policy has to beat, and the
  # anchor for relative MCS actions when drl_absolute_mcs is false. It absorbs
  # what neither the CQI nor the estimate can see, namely channel aging,
  # estimation error and neighbour-cell scheduling. The floor is wide because a
  # UE landing against 16 co-scheduled layers on every PRB group needs several
  # dB beyond whatever the inner loop already priced.
  olla_enabled: true
  olla_initial_offset_db: -2.0
  olla_ack_step_db: 0.1
  olla_nack_step_db: 1.0
  olla_min_offset_db: -20.0
  olla_max_offset_db: 6.0
  # Flat de-rating applied to the inner loop's prediction, for a deliberately
  # conservative reference. Zero leaves the inner loop unbiased.
  conservative_mcs_margin_db: 0.0
